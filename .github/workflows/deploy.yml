name: Deploy to Droplet

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Never move the droplet's checkout forward onto code that does not build.
  # `git reset --hard` on the server is not reversible from here, and a failed
  # image build would leave the old containers serving a newer tree.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd ~/Gridlock
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f