server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/geo+json
    image/svg+xml;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Content-hashed bundles; safe to cache indefinitely.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Large, rarely-changing map assets (region GeoJSON, the Space Needle model).
  location /seattle/ {
    add_header Cache-Control "public, max-age=86400";
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;

    # The heatmap SSE stream is long-lived. The 60s default read timeout would
    # kill it during any backend stall, and the browser's silent reconnect
    # makes that look like a frozen map rather than an error.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location = /healthz {
    proxy_pass http://backend:8000/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
